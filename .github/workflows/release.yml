name: Release do app

# Publica o instalador do app como RASCUNHO de release nos GitHub Releases (docs/distribuicao.md). O electron-updater dos
# apps instalados só enxerga releases PUBLICADAS: o rascunho espera alguém conferir o instalador e as notas e publicar.
#
# Como lançar: ajuste "version" em app/package.json, faça o commit e crie a tag com o mesmo número:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# duas execuções para a mesma tag ao mesmo tempo (um re-run disparado durante outro, por exemplo) criariam rascunhos em
# paralelo: a segunda espera a primeira terminar
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instalador:
    name: Instalador (testa, gera e publica o rascunho)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # a tag e o package.json têm que dizer o mesmo número: o electron-updater compara com a versão do app instalado
      - name: A tag é a versão do app
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $versao = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $versao) { throw "A tag diz $tag e o app/package.json diz $versao." }
          Write-Host "Versão $versao"

      - run: npm run check

      - name: Testes ponta a ponta (Playwright)
        run: npm run test:e2e

      # O rascunho nasce AQUI, uma vez só, antes do electron-builder. Ele envia o .exe e o .blockmap em paralelo e, no
      # electron-builder 26, cada envio pode montar o seu próprio "publisher" (PublishManager.getOrCreatePublisher só
      # guarda o publisher no cache depois de um await): sem release, cada um criou a sua e a v1.1.0 saiu com DOIS
      # rascunhos. Com o rascunho já criado, GitHubPublisher.getOrCreateRelease o acha na lista de releases (mesma tag,
      # draft) e só anexa os arquivos. Numa nova execução do workflow, o rascunho que já existe é reaproveitado.
      - name: Criar o rascunho da release (uma vez só)
        id: rascunho
        shell: pwsh
        run: |
          $repo = '${{ github.repository }}'
          $tag = '${{ github.ref_name }}'
          $versao = $tag.TrimStart('v')
          $cabecalho = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          # a mesma lista que o electron-builder consulta; ele aceita a tag com ou sem o "v"
          function Get-ReleasesDaTag {
            @(Invoke-RestMethod -Headers $cabecalho -Uri "https://api.github.com/repos/$repo/releases?per_page=100" `
                -FollowRelLink -MaximumFollowRelLink 10 |
              ForEach-Object { $_ } | Where-Object { $_.tag_name -in @($tag, $versao) })
          }

          $daTag = Get-ReleasesDaTag
          $publicadas = @($daTag | Where-Object { -not $_.draft })
          $rascunhos = @($daTag | Where-Object { $_.draft })
          if ($publicadas) {
            throw "Já existe uma release PUBLICADA com a tag $tag ($($publicadas[0].html_url)): suba a versão em vez de republicar."
          }
          if ($rascunhos.Count -gt 1) {
            throw "Há $($rascunhos.Count) rascunhos com a tag $tag (ids $($rascunhos.id -join ', ')): apague os que sobram e rode de novo (docs/distribuicao.md, seção 7)."
          }
          if ($rascunhos.Count -eq 1) {
            $id = $rascunhos[0].id
            Write-Host "Reaproveitando o rascunho $id que já existe para $tag."
          } else {
            $corpo = @{ tag_name = $tag; name = "Soulcrate $versao"; body = ''; draft = $true } | ConvertTo-Json
            $id = (Invoke-RestMethod -Method Post -Headers $cabecalho -ContentType 'application/json' `
                -Uri "https://api.github.com/repos/$repo/releases" -Body $corpo).id
            Write-Host "Rascunho $id criado para $tag."
          }

          # o electron-builder procura o rascunho nessa lista: só segue quando ele aparece lá (senão ele criaria outro)
          for ($tentativa = 1; $tentativa -le 6; $tentativa++) {
            if (@(Get-ReleasesDaTag | Where-Object { $_.draft -and $_.id -eq $id }).Count -eq 1) { break }
            if ($tentativa -eq 6) { throw "O rascunho $id não apareceu na lista de releases; o electron-builder criaria outro." }
            Start-Sleep -Seconds 5
          }
          "id=$id" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # com os segredos CSC_LINK e CSC_KEY_PASSWORD no repositório o electron-builder assina o instalador sozinho;
      # sem eles sai sem assinatura e o SmartScreen avisa (docs/distribuicao.md)
      - name: Gerar o instalador e anexar ao rascunho da release
        run: npm run dist:publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}

      # checksums SHA-256 junto da release: quem baixa confere o arquivo antes de rodar. A release ainda é um
      # RASCUNHO, e a API de "release por tag" (usada pelo `gh release upload`) não enxerga rascunhos: usa o id devolvido
      # pelo passo do rascunho, confere que o electron-builder anexou tudo NELE e que não surgiu um segundo rascunho.
      - name: Checksums SHA-256
        shell: pwsh
        run: |
          $linhas = Get-ChildItem dist -Filter 'Soulcrate-Setup-*.exe' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          if (-not $linhas) { throw 'Nenhum instalador em app/dist.' }
          $linhas | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

          $repo = '${{ github.repository }}'
          $tag = '${{ github.ref_name }}'
          $versao = $tag.TrimStart('v')
          $id = '${{ steps.rascunho.outputs.id }}'
          if (-not $id) { throw 'O passo "Criar o rascunho da release" não devolveu o id do rascunho.' }
          $cabecalho = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }

          # nova tentativa curta: logo depois de criada ou alterada, a release pode responder 404 por alguns segundos
          function Invoke-GitHub([string] $Metodo, [string] $Uri, [hashtable] $Extra = @{}) {
            for ($tentativa = 1; $tentativa -le 5; $tentativa++) {
              $resposta = Invoke-RestMethod -Method $Metodo -Headers $cabecalho -Uri $Uri @Extra `
                -SkipHttpErrorCheck -StatusCodeVariable status
              if ($status -lt 400) { return $resposta }
              if ($status -ne 404 -or $tentativa -eq 5) {
                throw "$Metodo $Uri respondeu ${status}: $($resposta | ConvertTo-Json -Compress -Depth 5)"
              }
              Write-Host "$Metodo $Uri respondeu 404; nova tentativa em 5 s ($tentativa/5)."
              Start-Sleep -Seconds 5
            }
          }

          $rascunhos = @(Invoke-RestMethod -Headers $cabecalho -Uri "https://api.github.com/repos/$repo/releases?per_page=100" `
              -FollowRelLink -MaximumFollowRelLink 10 |
            ForEach-Object { $_ } | Where-Object { $_.draft -and $_.tag_name -in @($tag, $versao) })
          if ($rascunhos.Count -gt 1) {
            $lista = ($rascunhos | ForEach-Object { "  id $($_.id): $(@($_.assets.name) -join ', ')" }) -join "`n"
            throw ("Há $($rascunhos.Count) rascunhos com a tag $tag (o deste workflow é o $id):`n$lista`n" +
              "Junte os arquivos no rascunho $id, APAGUE os outros antes de publicar e anexe o SHA256SUMS.txt do artefato " +
              "instalador-release (docs/distribuicao.md, seção 7).")
          }

          $release = Invoke-GitHub Get "https://api.github.com/repos/$repo/releases/$id"
          if (-not $release.draft -or $release.tag_name -ne $tag) { throw "A release $id não é mais o rascunho de $tag." }
          $esperados = @("Soulcrate-Setup-$versao.exe", "Soulcrate-Setup-$versao.exe.blockmap", 'latest.yml')
          $faltando = @($esperados | Where-Object { $_ -notin @($release.assets.name) })
          if ($faltando) { throw "O rascunho $id está sem: $($faltando -join ', ') (o electron-builder anexou em outra release?)." }

          # numa nova execução do workflow, o SHA256SUMS.txt antigo sai antes de o novo entrar
          foreach ($asset in @($release.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' })) {
            Invoke-GitHub Delete "https://api.github.com/repos/$repo/releases/assets/$($asset.id)" | Out-Null
          }
          Invoke-GitHub Post "https://uploads.github.com/repos/$repo/releases/$id/assets?name=SHA256SUMS.txt" `
            @{ ContentType = 'text/plain'; InFile = 'dist/SHA256SUMS.txt' } | Out-Null
          Write-Host "SHA256SUMS.txt anexado ao rascunho $id ($tag): $($release.html_url)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # roda mesmo se um passo anterior falhar (os checksums, por exemplo): o instalador fica disponível para conferência
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instalador-release
          path: |
            app/dist/Soulcrate-Setup-*.exe
            app/dist/Soulcrate-Setup-*.exe.blockmap
            app/dist/latest.yml
            app/dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
