name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    name: Scripts (${{ matrix.shell == 'pwsh' && 'PowerShell 7' || 'Windows PowerShell 5.1' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # o slskd falso dos testes de integracao roda em Node.js
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc

      - name: Instalar o Pester
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Get-Module -ListAvailable Pester | Select-Object -First 1 Name, Version

      - name: Testes (Pester)
        run: ./tests/Invoke-Testes.ps1 -CI

      - name: Resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-${{ matrix.shell }}
          path: tests/resultado-pester-*.xml
          if-no-files-found: ignore

  app:
    name: App (lint, tipos, testes e ponta a ponta)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # o app de verdade (Electron) contra um dublê do docker: nada aqui toca em Docker nem na stack
      - name: Testes ponta a ponta (Playwright)
        run: npm run test:e2e

      - name: Capturas de tela dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  instalador:
    name: Instalador (gera, instala, abre e fecha)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - name: Gerar o instalador (NSIS, sem assinatura)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: app/dist/Soulcrate-Setup-*.exe
          retention-days: 14

      # Critério de aceite da Fase 0: o instalador instala, abre e fecha. O `--smoke-test` abre a janela, confere
      # o preload e o IPC (window.soulcrate.app.getInfo) e sai com 0.
      - name: Instalar, abrir e fechar
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Soulcrate-Setup-*.exe' | Select-Object -First 1
          $instalacao = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($instalacao.ExitCode -ne 0) { throw "O instalador saiu com código $($instalacao.ExitCode)" }
          # a pasta por usuário depende do nome do pacote: procura o executável em vez de supor o caminho
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Soulcrate.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Out-String | Write-Host
            throw 'O app não foi instalado em %LOCALAPPDATA%\Programs'
          }
          Write-Host "Instalado em $exe"
          # o instalador abre o app sozinho no fim: fecha esse antes do teste
          Get-Process Soulcrate -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "O app instalado saiu com código $($app.ExitCode)" }
          Write-Host 'Instalou, abriu e fechou.'

      - name: Desinstalar
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-Process Soulcrate -ErrorAction SilentlyContinue | Stop-Process -Force
          $un = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($un -and (Test-Path $un)) {
            Start-Process $un -ArgumentList '/S' -Wait
            # o desinstalador termina por uma cópia na pasta temporária: espera o programa sumir
            for ($i = 0; $i -lt 60 -and (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Soulcrate.exe' -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          }

      # Critério de aceite da Fase 7: instalar, atualizar de uma versão para a seguinte e desinstalar sem perder o .env,
      # as listas, o lotes/ nem a biblioteca (scripts/testar-instalador.ps1). Os dois instaladores de teste não abrem o app
      # sozinhos no fim (runAfterFinish=false); o de "versão anterior" só difere no número da versão.
      - name: Gerar os instaladores de teste (versão anterior e versão atual)
        run: |
          npx electron-builder --win nsis --publish never '-c.extraMetadata.version=0.0.1' '-c.directories.output=dist-anterior' '-c.nsis.runAfterFinish=false'
          npx electron-builder --win nsis --publish never '-c.directories.output=dist-teste' '-c.nsis.runAfterFinish=false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Instalar, atualizar e desinstalar sem perder nada do usuário
        shell: pwsh
        run: |
          $versao = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/testar-instalador.ps1 `
            -Anterior dist-anterior/Soulcrate-Setup-0.0.1.exe `
            -Atual "dist-teste/Soulcrate-Setup-$versao.exe" `
            -VersaoAnterior 0.0.1 -VersaoAtual $versao -TestarApagarDados
